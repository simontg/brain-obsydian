# Publishes the page and the encrypted graph to GitHub Pages. graph/graph.enc.json is pushed by the
# generate-graph-index workflow of the private notes repo; this workflow never builds data itself.
# (Stage 1.5 synthetic pilot: run tools/pilot_build.py locally; do not commit its output over the real graph.)
name: pages
on:
  push:
    branches: [main]
    paths: [graph/graph.enc.json, graph/graf-wiki.html, .github/workflows/pilot-graph.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (the page is an artifact fragment, so add doctype, charset, viewport)
        run: |
          mkdir site
          { printf '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'; cat graph/graf-wiki.html; } > site/index.html
          cp graph/graph.enc.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
