<style>

@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

<div class="app">
  <header class="bar">

    <div class="fresh off" id="fresh"><span class="led"></span><span id="freshtxt">Wczytywanie danych z Dysku...</span></div>

</div>

<script>
const FOLDER_OUT = "1vyq6DNfJ4it8poszcPXRlkPlSaykyHEI"; // Projekty/Obsidian-graf: tu skrypt wiki_graph.py zapisuje GRAPH-AUTO.json
const FALLBACK_ID = "1_8l49uTR8LomAfFyDEIjdE6KmneL4NqR";
const SERVER = "Google Drive";
const STALE_MIN = 120;
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

let mcp = null, data = null, nodes = [], links = [], byId = new Map(), adj = new Map();
let sim = null, zoom = null, T = d3.zoomIdentity, W = 0, H = 0, DPR = 1;
let sel = null, hover = null, query = "", typeOff = new Set(), kindOff = new Set();
let colorCache = null, raf = 0, fitted = false, tweenRaf = 0;
let view = "rings", areaSel = null, showNames = false;
let timeLanes = [], timeScale = null, timeDays = [], timeX = [0, 0];
let areas = [], areaById = new Map(), sectors = [], ringR = {}, ringTypes = [], hot = null;

const KIND_LABEL = {hub:"z huba", related:"powiązane (Related)", link:"linki [[...]]", heuristic:"domyślne (z treści)"};
const TYPE_LABEL = {hub:"hub", project:"projekt", decision:"decyzja", "how-to":"instrukcja", topic:"temat", source:"źródło", meta:"meta"};
const RING_ORDER = ["hub","project","decision","how-to","topic","source"];
const RING_LABEL = {hub:"huby", project:"projekty", decision:"decyzje", "how-to":"instrukcje", topic:"tematy", source:"źródła"};

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const norm = s => (s||"").replace(/ł/g,"l").replace(/Ł/g,"L").normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase();
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function colors(){
  if (colorCache) return colorCache;
  const a = [0,1,2,3,4,5,6].map(i => css("--a" + i));
  colorCache = {fg:css("--fg"),mut:css("--mut"),edge:css("--edge"),accent:css("--accent"),warn:css("--warn"),halo:css("--halo"),line:css("--line"),guide:css("--guide"),core:css("--core"),font:css("--font"),mono:css("--mono"),a};
  return colorCache;
}
const areaColor = n => { const c = colors(), ar = areaById.get(n.area); return c.a[ar ? ar.idx : 0]; };
const areaVar = ar => "var(--a" + (ar ? ar.idx : 0) + ")";
function ago(iso){
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (!isFinite(m)) return "";
  if (m < 1) return "przed chwilą"; if (m < 60) return m + " min temu";
  const hh = Math.floor(m/60); if (hh < 48) return hh + " godz. temu"; return Math.floor(hh/24) + " dni temu";
}
function fmt(iso){
  const d = new Date(iso); if (isNaN(d)) return iso || "";
  return d.toLocaleString("pl-PL", {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
}
const fmtDay = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("pl-PL", {day:"numeric", month:"short"}); };
// In Claude the graph comes from Drive (id = Google Doc ID); on Pages from the notes repo (id = file name in wiki/, opens only when signed in to GitHub).
const docUrl = id => window.claude ? "https://docs.google.com/document/d/" + id + "/edit" : "https://github.com/simontg/Brain-Obsydian-NOTES/blob/main/wiki/" + encodeURIComponent(id + ".txt");
const short = (s, n) => s.length > n ? s.slice(0, n - 1) + "…" : s;

/* ---------- kształty: rodzaj notatki ---------- */
const SH = {
  hub: "8,1 14.5,4.5 14.5,11.5 8,15 1.5,11.5 1.5,4.5", meta: "8,1 14.5,4.5 14.5,11.5 8,15 1.5,11.5 1.5,4.5",
  decision: "8,0.8 15.2,8 8,15.2 0.8,8", "how-to": "8,1.5 15,13.5 1,13.5"
};
function glyph(type, color, size){
  const NS = "http://www.w3.org/2000/svg", s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 16 16"); s.setAttribute("width", size || 14); s.setAttribute("height", size || 14); s.setAttribute("aria-hidden", "true");
  let e;
  if (SH[type]){ e = document.createElementNS(NS, "polygon"); e.setAttribute("points", SH[type]); }
  else if (type === "project"){ e = document.createElementNS(NS, "rect"); for (const [k,v] of [["x",2],["y",2],["width",12],["height",12],["rx",1.5]]) e.setAttribute(k, v); }
  else { e = document.createElementNS(NS, "circle"); for (const [k,v] of [["cx",8],["cy",8],["r",6.2]]) e.setAttribute(k, v); }
  const hollow = type === "source" || type === "meta";
  e.setAttribute("fill", hollow ? "none" : color); e.setAttribute("stroke", color); e.setAttribute("stroke-width", hollow ? 2 : 1);
  s.append(e); return s;
}
function shapePath(type, x, y, r){
  ctx.beginPath();
  if (type === "hub" || type === "meta"){ const q = r * 1.18; for (let i = 0; i < 6; i++){ const a = Math.PI / 3 * i - Math.PI / 6, px = x + q * Math.cos(a), py = y + q * Math.sin(a); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.closePath(); }
  else if (type === "project"){ const q = r * .92; ctx.rect(x - q, y - q, 2 * q, 2 * q); }
  else if (type === "decision"){ const q = r * 1.25; ctx.moveTo(x, y - q); ctx.lineTo(x + q, y); ctx.lineTo(x, y + q); ctx.lineTo(x - q, y); ctx.closePath(); }
  else if (type === "how-to"){ const q = r * 1.2; ctx.moveTo(x, y - q); ctx.lineTo(x + q * .95, y + q * .75); ctx.lineTo(x - q * .95, y + q * .75); ctx.closePath(); }
  else ctx.arc(x, y, r, 0, 6.2832);
}

/* ---------- ładowanie danych ---------- */
function showMsg(kind, title, text, actions){
  const m = $("msg"); m.replaceChildren();
  if (!title){ m.hidden = true; return; }
  m.hidden = false;
  m.append(h("div", {class:"box" + (kind === "err" ? " err" : "")}, h("h2", {text:title}), text ? h("p", {text}) : null, ...(actions||[])));
}
function setFresh(text, cls){ $("freshtxt").textContent = text; $("fresh").className = "fresh" + (cls ? " " + cls : ""); }
function explain(e){
  const code = e && e.code || "";
  const retry = h("button", {class:"btn primary", type:"button", onclick:() => load()}, "Spróbuj ponownie");
  switch (code){
    case "server_not_connected": return ["Dysk Google nie jest połączony", "Połącz konektor Google Drive w ustawieniach aplikacji Claude i otwórz stronę ponownie.", [retry]];
    case "consent_required": case "not_granted": return ["Brak zgody na odczyt z Dysku", "Strona potrzebuje zgody na odczyt jednego pliku z Dysku. Zatwierdź ją w oknie zgody albo w menu Uprawnienia tej strony.", [retry]];
    case "not_in_manifest": return ["Konektor wyłączony dla tej strony", "Włącz Google Drive w menu Uprawnienia tej strony, potem spróbuj ponownie.", [retry]];
    case "server_unavailable": case "upstream_error": return ["Dysk chwilowo nie odpowiada", "To zwykle przejściowe. Spróbuj za chwilę.", [retry]];
    default: return ["Nie udało się wczytać grafu", (code ? code + ": " : "") + (e && e.message ? e.message : String(e)), [retry]];

async function fetchEncrypted(){

/* ---------- model ---------- */
function deriveAreas(){
  // Obszar notatki = hub, który do niej prowadzi (krawędź "hub"). Przy kilku hubach: pierwszy. Meta (HOT, INDEX, LOG) są w środku.
  const hubs = nodes.filter(n => n.type === "hub");
  const owner = new Map(hubs.map(n => [n.id, n.id]));
  for (const l of links) if (l.kind === "hub" && byId.get(l.source.id).type === "hub" && !owner.has(l.target.id)) owner.set(l.target.id, l.source.id);
  for (const n of nodes){
    if (n.type === "meta"){ n.area = "_meta"; continue; }
    if (!owner.has(n.id)){
      const votes = new Map();
      for (const m of adj.get(n.id) || []) if (owner.has(m)) votes.set(owner.get(m), (votes.get(owner.get(m)) || 0) + 1);
      const best = [...votes.entries()].sort((a, b) => b[1] - a[1])[0];

    n.area = owner.get(n.id);

  const groups = d3.group(nodes.filter(n => n.type !== "meta"), n => n.area);
  areas = [...groups.entries()].map(([id, list]) => {
    const hubNode = byId.get(id);
    const name = hubNode ? hubNode.title.replace(/^Hub:\s*/i, "") : "Bez huba";
    return {id, name, count: list.length, last: d3.max(list, n => n.modified) || "", hub: hubNode || null};

}

function metaPos(){
  const metas = nodes.filter(n => n.type === "meta"), hotN = metas.find(n => n.title === "HOT") || null;

}

function computeTime(){
